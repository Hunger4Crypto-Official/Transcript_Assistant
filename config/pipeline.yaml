# =============================================================================
# Plaud Bridge :: Pipeline Configuration
# =============================================================================
# Every tunable lives here. Code reads config; code does not hardcode policy.
# Changing behaviour should mean editing this file, not editing src/.
# =============================================================================

version: 1

paths:
  # Drop exported Plaud audio (.mp3/.wav) or transcripts (.txt/.srt) here.
  inbox: "./data/inbox"
  # Working scratch. Safe to delete. Rebuilt on demand.
  work: "./data/work"
  # Processed artifacts (markdown + json), organised by date.
  outbox: "./data/outbox"
  # Encrypted vault for high-sensitivity profiles.
  vault: "./data/vault"
  # Quarantine for files that failed the compliance gate.
  quarantine: "./data/quarantine"
  # SQLite index.
  database: "./data/bridge.db"
  # Rotating logs.
  logs: "./data/logs"

ingest:
  # Accepted extensions. Audio goes through ASR; text skips straight to analysis.
  audio_extensions: [".mp3", ".wav", ".m4a", ".flac", ".ogg"]
  text_extensions: [".txt", ".srt", ".md"]
  # Content-hash dedupe. A file already in the DB is skipped, never reprocessed.
  dedupe: true
  # Move originals out of inbox after successful processing.
  archive_originals: true
  # The original recording is the actual voices, which makes it the most
  # sensitive artifact of the lot. When the governing profile encrypts at rest,
  # the original goes into the vault rather than sitting in _processed/ in the
  # clear. Get it back with: run.py open <id> --kind audio --out file.mp3
  # Encrypted a chunk at a time, so a full day of audio never has to be resident
  # in memory.
  encrypt_archived_audio: true
  # Skip files modified in the last N seconds. A large recording still being
  # copied into the inbox would otherwise be ingested half-written, and the
  # content hash of the partial file is what gets deduped forever after.
  settle_seconds: 5
  # Refuse files larger than this. A full working day is the design point now:
  # roughly 450MB as 128kbps mp3, more at higher bitrates, and the normalised
  # WAV that ffmpeg writes to scratch is around 115MB per hour on top of that.
  # Originals are encrypted a chunk at a time, so this is a disk budget rather
  # than a memory one.
  max_file_mb: 2048

audio:
  # ffmpeg must be on PATH.
  ffmpeg_binary: "ffmpeg"
  ffprobe_binary: "ffprobe"
  # ASR models want 16kHz mono. Normalising here removes a whole class of bugs.
  target_sample_rate: 16000
  target_channels: 1
  # Loudness normalisation. Plaud pin recordings run quiet; card recordings do not.
  normalize_loudness: true
  loudness_target_lufs: -16.0
  # Cloud ASR endpoints cap uploads at ~25MB. Chunk below that with overlap
  # so a word cut in half at a boundary is recovered by the stitcher.
  chunk_seconds: 600
  chunk_overlap_seconds: 8
  max_chunk_mb: 20

asr:
  # Provider order is a fallback chain, not a preference list.
  # The compliance gate can VETO a cloud provider for a given recording;
  # if it does, the chain skips to the first local provider.
  providers: ["groq", "local"]

  groq:
    enabled: true
    api_key_env: "GROQ_API_KEY"
    base_url: "https://api.groq.com/openai/v1"
    model: "whisper-large-v3-turbo"
    # Verify at groq.com/pricing before trusting cost estimates.
    usd_per_audio_hour: 0.04
    temperature: 0.0
    timeout_seconds: 300
    max_retries: 4
    is_cloud: true

  # How much of a transcript the recogniser was guessing at.
  #
  # Whisper does not decline. Given a car radio, a restaurant, a recital, or a
  # device in a pocket, it returns fluent English that nobody said -- and
  # everything downstream treats the transcript as fact, so an invented sentence
  # becomes a commitment you believe you made. Nothing here deletes or refuses.
  # It says so, in the log, in the digest, and in the extraction prompt.
  confidence:
    # Average log probability per segment. Clean speech sits above about -0.5;
    # well below -1.0 the model is guessing. The one most worth moving for your
    # own microphone -- check `open <id> --kind transcript` against the audio.
    min_avg_logprob: -1.0
    # The recogniser's own probability that a span held no speech. High
    # no-speech alongside fluent text is the hallucination signature.
    max_no_speech_prob: 0.6
    # Share of scored speech below those lines before the transcript is called
    # shaky, and before it is called untrustworthy. Weighted by duration, so
    # four minutes of invented music does not hide behind a crowd of real
    # two-second replies.
    suspect_share: 0.30
    unreliable_share: 0.60
    # Too little speech to judge. Calling a ten second note unreliable on two
    # shaky segments is noise rather than a warning.
    min_seconds: 20.0

  local:
    enabled: true
    # pip install faster-whisper
    model: "large-v3"
    device: "auto"          # auto | cpu | cuda
    compute_type: "auto"    # auto | int8 | float16
    beam_size: 5
    usd_per_audio_hour: 0.0
    is_cloud: false

diarization:
  enabled: true
  # "pyannote" runs locally (needs HF token + accepted model licence).
  # "none" produces a single unlabelled speaker track.
  provider: "pyannote"
  pyannote:
    model: "pyannote/speaker-diarization-3.1"
    hf_token_env: "HUGGINGFACE_TOKEN"
    device: "auto"
  min_speakers: 1
  max_speakers: 6
  # Map the dominant speaker to you. Plaud sits on your body, so the loudest
  # and most-present voice is almost always the wearer.
  assume_owner_is_dominant_speaker: true
  owner_label: "Sasson"

  # ---------------------------------------------------------------------
  # Named speakers. Diarization can tell three people apart but has never
  # heard any of them before, so "Speaker 2" is the best it can do alone.
  # Enroll someone once and their cluster comes back with their name:
  #
  #   python run.py speakers enroll "Marcus" --audio clips/marcus.wav
  #   python run.py speakers identify data/inbox/2026-07-14.mp3
  #
  # Voiceprints are stored encrypted in the vault and never leave the machine.
  # ---------------------------------------------------------------------
  identify:
    enabled: true
    # Local, like everything else here. Needs a HuggingFace token the first
    # time only, or fetch it ahead with scripts/fetch_models.py --embedding.
    model: "pyannote/embedding"
    # Cosine similarity a cluster must reach before it gets a name at all.
    # Raise it if you see wrong names; lower it if people go unrecognised.
    # `speakers identify` prints the actual scores, which is the only sane
    # way to pick this number for your own recordings and your own room.
    threshold: 0.55
    # And it must beat the runner-up by this much. Two brothers scoring 0.61
    # and 0.60 means the model cannot tell them apart on this audio, and a
    # coin flip would put a wrong name on a transcript somebody will believe.
    margin: 0.08
    # Clusters with less speech than this are not guessed at.
    min_speech_seconds: 3.0
    # How many of a cluster's longest spans to average into one vector.
    max_crops: 8

llm:
  # Token rates below are what feed cost.halt_usd_per_run. They are a guardrail,
  # not an invoice: they are read from the usage each provider reports, and a
  # provider with both rates at 0 contributes nothing to the running total and
  # says so in the log. VERIFY THESE AGAINST CURRENT PUBLISHED PRICING before
  # relying on the halt threshold. Prices move; this file does not.
  providers: ["anthropic", "groq"]

  anthropic:
    enabled: true
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com/v1"
    model: "claude-opus-5"
    version_header: "2023-06-01"
    # Thinking is on by default on this generation and shares this ceiling with
    # the response, so a budget sized around the JSON alone truncates mid-object.
    max_tokens: 16000
    # NOTE: there is no temperature here and adding one back is a 400, not a
    # no-op -- the sampling parameters were removed on this generation. It was
    # pinned to 0.0 for determinism, which it never actually guaranteed; the
    # output contract in the extraction prompt does that job.
    #
    # Reasoning depth, and the cost lever that replaced the token budget:
    # low | medium | high | xhigh | max. Extraction is a read-and-fill task
    # against a transcript rather than an open reasoning problem, so it does not
    # want the ceiling. Raise it if analyses read as shallow on hard recordings.
    effort: "medium"
    # Send the profile's system prompt as a cached block. It is byte-identical
    # across every recording and every episode, so without this the same few
    # thousand tokens are paid for at full price forever. Cache reads bill at a
    # fraction of fresh input.
    cache_system_prompt: true
    timeout_seconds: 180
    max_retries: 4
    is_cloud: true
    # Verify at anthropic.com/pricing.
    usd_per_million_input_tokens: 5.00
    usd_per_million_output_tokens: 25.00

  groq:
    enabled: true
    api_key_env: "GROQ_API_KEY"
    base_url: "https://api.groq.com/openai/v1"
    model: "llama-3.3-70b-versatile"
    max_tokens: 8000
    temperature: 0.0
    timeout_seconds: 180
    max_retries: 4
    is_cloud: true
    # Verify at groq.com/pricing.
    usd_per_million_input_tokens: 0.59
    usd_per_million_output_tokens: 0.79

  local:
    enabled: false
    base_url: "http://localhost:11434/v1"   # ollama-compatible
    model: "llama3.3:70b"
    max_tokens: 8000
    temperature: 0.0
    timeout_seconds: 600
    max_retries: 2
    is_cloud: false
    # Your electricity bill is not an API charge.
    usd_per_million_input_tokens: 0.0
    usd_per_million_output_tokens: 0.0

routing:
  # Stage 1: cheap keyword prescore narrows the candidate set.
  # Stage 2: one LLM call scores every candidate at once.
  # A recording can match several profiles. Family dinner where a client calls
  # is legitimately Husband + Father + Insurance Agent.
  multi_label: true
  keyword_prescore_weight: 0.35
  llm_confirm: true
  # Profiles scoring below their own min_confidence are dropped.
  # If nothing survives, the recording lands in "unfiled" and is still searchable.
  fallback_profile: "unfiled"
  max_profiles_per_recording: 4

compliance:
  # Master switch. Turning this off is a deliberate, logged act.
  enabled: true
  # Scan the opening window of the transcript for a consent statement.
  consent_window_seconds: 90
  # What happens when a consent-required profile has no detectable consent.
  # "quarantine" = stop, do not analyse, flag for human review. Recommended.
  # "flag"       = analyse but stamp the output with a warning.
  on_missing_consent: "quarantine"
  # Two-party / all-party consent states in your licence footprint.
  # Verify current statutes with counsel. This list is an operational default,
  # not legal advice.
  all_party_consent_states: ["NV", "FL", "CA", "WA", "PA", "MA", "IL", "MD", "MT", "NH", "CT", "MI", "OR", "DE"]
  # Redact these before any transcript leaves the machine for a cloud LLM.
  redact_patterns:
    ssn: '\b\d{3}-\d{2}-\d{4}\b'
    credit_card: '\b(?:\d[ -]*?){13,19}\b'
    policy_number: '\b[A-Z]{2,4}[- ]?\d{6,12}\b'
    dob: '\b(?:0?[1-9]|1[0-2])[/-](?:0?[1-9]|[12]\d|3[01])[/-](?:19|20)\d{2}\b'
    email: '\b[\w.+-]+@[\w-]+\.[\w.]{2,}\b'
    phone: '(?:\+?1[ -.]?)?\(?\b\d{3}\b\)?[ -.]?\d{3}[ -.]?\d{4}\b'
  # Escalation rule. When a recording routes to several profiles, the strictest
  # profile's processing policy governs the ENTIRE recording. One private
  # sentence in a business meeting locks the whole file down.
  strictest_profile_governs: true

retention:
  # Nightly sweep. Nothing is deleted without a dry run you can inspect first.
  enabled: true
  dry_run_default: true
  # Keep raw audio only as long as you actually need it. Transcripts are cheap
  # to keep; audio is the liability.
  raw_audio_days: 90
  # Per-profile overrides live in the profile files and win over this default.
  default_transcript_days: 365

digest:
  default_window_days: 7
  # Sections render in this order. Omitting a profile hides it from "all".
  section_order: ["insurance_agent", "sales_trainer", "father", "husband", "unfiled"]
  include_transcript_links: true
  include_cost_summary: true
  max_items_per_section: 40

cost:
  # Soft guardrail. The pipeline warns and pauses past this per-run spend.
  warn_usd_per_run: 2.00
  halt_usd_per_run: 10.00

logging:
  level: "INFO"
  # Never write transcript content into logs. Hashes and IDs only.
  redact_content: true
  rotate_mb: 20
  backups: 5

voice:
  # Which voice pack in config/voice/ supplies the digest wording.
  #   plain  - neutral and factual (default)
  #   brief  - short and scannable, for reading on a phone
  #   warm   - written like a person assembled it; suits the personal profiles
  # `run.py voices` lists what is installed.
  preset: "plain"
  # Override individual strings without copying a whole pack. Same shape as the
  # pack files, merged on top of the chosen preset.
  overrides: {}
    # digest:
    #   needs_you:
    #     heading: "Before You Do Anything Else"

episodes:
  # A day is not one conversation. Long recordings are cut into episodes, each
  # routed on its own, so every profile gets a rundown built only from the parts
  # of the day that belong to it.
  enabled: true
  # Recordings shorter than this are treated as one conversation. Cutting a
  # twenty minute client call into pieces multiplies the routing cost for
  # nothing.
  skip_below_seconds: 900
  # Boundary signals, strongest first. A gap this long means people left.
  silence_gap_seconds: 45
  # How much the set of speakers has to change to count as a new conversation.
  speaker_change_above: 0.6
  # Vocabulary overlap between the window before and after a candidate point.
  # Below this and the subject has changed.
  topic_overlap_below: 0.08
  comparison_window_segments: 12
  # An episode shorter than this is a fragment and gets folded into its
  # neighbour; one longer than this is split regardless of coherence.
  min_seconds: 120
  max_seconds: 1800
  # Each episode costs one routing call. This caps a pathological day.
  max_per_recording: 40

runtime:
  # Offline is an assertion, not a preference. Turn this on and the config
  # refuses to load while any cloud provider is enabled, every model must
  # already be on disk, and the ASR and diarization backends are told never to
  # reach for a download.
  #
  # To set up an air-gapped machine, on a networked one first:
  #   python scripts/fetch_models.py --all
  # then copy models/ and wheels/ across, and:
  #   pip install --no-index --find-links wheels -e .
  #   python run.py doctor --offline
  offline: false
  # Where local model weights live. Relative paths resolve against the project.
  models_dir: "./models"

followups:
  # Commitments become a worklist, and a worklist becomes a DRAFT that you send
  # yourself. There is no mail configuration in this block because the code has
  # no way to use one. That is the design, not an omission.

  # Which extraction fields hold something somebody owes somebody. Matched
  # against each field's key AND its label, so `promises_i_made`,
  # `commitments_by_producer`, `action_items`, and "What They Asked For" are all
  # found without being named. Add a token when a new profile calls it something
  # these do not reach.
  field_tokens: ["commitment", "promise", "action", "follow_up", "followup",
                 "task", "todo", "asked_for", "asks_from", "next_step"]
  # Name the fields outright for one profile when the tokens cannot reach them.
  # An explicit list wins over field_tokens, for that profile only.
  # fields:
  #   father: ["promises_i_made", "next_action"]

  # How many recordings the worklist opens. There is deliberately no default day
  # window -- a promise does not stop counting because it is old -- so this is
  # the bound instead.
  max_recordings: 500
  # A commitment longer than this is truncated. The id is derived from the text,
  # so changing this re-ids anything it was truncating and those items will look
  # new once.
  max_text_chars: 400

  # Let an LLM phrase a draft when one is reachable. Off is not a degraded mode:
  # the template path is deterministic, needs no network, and is frequently the
  # better output. Either way the strictest profile in the draft decides whether
  # a cloud model may see it at all, and one locked profile locks the whole draft.
  draft_with_llm: true
  draft_max_tokens: 1200
  # Ceiling on how many follow-ups go into one draft. A message listing forty
  # things is not a follow-up, it is an invoice.
  max_per_draft: 25

ask:
  # Conversational question answering over the archive. Retrieval first: the
  # ranking below is deterministic and runs with no model configured at all,
  # which is also the fallback. Without a usable provider `ask` returns the
  # excerpts and says plainly that they are search output rather than an answer.

  # How far back a question looks by default. 0 searches the whole archive.
  days: 90
  # How many recordings may contribute to one answer. Past a handful the model
  # starts averaging conversations together instead of citing one of them.
  limit: 6
  # How many recordings may be OPENED while ranking. This bounds work, not
  # results, exactly like search's --scan-limit, and a bounded answer says it
  # was bounded. 0 opens everything in the window.
  scan_limit: 200
  # The context ceiling, in characters. Excerpts past it are dropped in ranked
  # order, and both the prompt and the answer say how many. Raise it if your
  # local model has the room; a bigger bundle is not automatically a better
  # answer, and it is always a slower one.
  max_context_chars: 24000
  # Excerpts taken from any one recording, and how many neighbouring segments
  # travel with each. A promise usually spans two turns, so one either side is
  # the difference between a quote and a fragment.
  excerpts_per_recording: 4
  excerpt_context: 1
  # Ranking. Term coverage dominates and everything else is a tie-break.
  # Recency is deliberately weak: a client from March should not lose to last
  # Tuesday's coffee on the grounds that Tuesday is nearer.
  min_term_length: 3
  recency_half_life_days: 30
  recency_weight: 0.25
  # A hit inside a stored analysis is worth more than one in raw speech,
  # because the analyses are the curated read of the same conversation.
  analysis_weight: 0.5
  # A "quoted phrase" in the question triggers an exact-substring pass through
  # the same search that `search --content` uses, and recordings it finds are
  # promoted by this much. It costs a second pass over the archive, so it only
  # runs when the question actually contains quotes.
  phrase_bonus: 2.0
  # Output ceiling for the answer itself. An answer is a paragraph and a few
  # citations; a large number here buys latency and nothing else.
  max_tokens: 2000

memory:
  # Learning across recordings. Every ledger is built from analyses that are
  # already stored, so nothing here costs an LLM call and everything here can be
  # thrown away and rebuilt from the archive: run.py memory --rebuild
  enabled: true
  # One encrypted file per profile. Deliberately not under paths.vault: `verify`
  # lists anything in the vault the artifact index does not know about, and five
  # ledgers sitting in that list forever would teach you to skim it.
  dir: "./data/memory"
  # The briefing injected into the next extraction prompt is hard-capped at this
  # many characters, newest and most-mentioned first. A briefing long enough to
  # compete with the transcript is a briefing that changes the analysis.
  brief_budget_chars: 1500
  # How long an entry keeps being surfaced after it was last heard. This is not
  # deletion -- the entry keeps its provenance and simply stops being carried
  # forward, because a brief full of things that stopped being true is worse
  # than a short one. 0 means never expire.
  decay_days:
    commitment: 180
    person: 120
    topic: 90
    fact: 365
  # An unkept promise is the thing you most want carried forward, so it outranks
  # an equally-mentioned subject by this much.
  commitment_boost: 2.0
  # Caps on how much one recording can contribute. A single talkative afternoon
  # should not fill the ledger.
  max_entry_chars: 200
  max_items_per_field: 12
  # Which drawer an extraction field goes in: commitment, person, topic, fact,
  # or "ignore". The shipped profiles' fields are already mapped in code; map
  # your own here. A field nobody has classified is left out rather than guessed
  # at, and sensitive or suppressed fields are never filed whatever this says.
  field_kinds: {}
  ignore_fields: []
  # A commitment is closed only by a later recording that says it was done, in
  # one of these fields. Declare one in a profile's extraction schema to use it.
  # Deciding a promise was kept because its words came up again would be
  # inventing, and a stale open commitment is the cheaper mistake by far.
  closure_fields: ["completed", "closed_items", "delivered", "done", "resolved"]
  closure_overlap: 0.75
