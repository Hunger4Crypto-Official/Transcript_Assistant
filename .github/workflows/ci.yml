name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q

      # The suite runs without ffmpeg, faster-whisper, or any API key on
      # purpose: nothing in it may reach a network or a cloud provider. This
      # step fails the build if a test ever starts needing one.
      - name: Confirm the suite needs no cloud credentials
        env:
          GROQ_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          HUGGINGFACE_TOKEN: ""
          PLAUD_BRIDGE_PASSPHRASE: ""
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests run.py

  compliance-guards:
    name: compliance guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      # GOVERNANCE.md ADR-003 and ADR-004 are the two controls that cannot be
      # allowed to regress silently. Running them as their own job means a red
      # X here says "a privacy guarantee broke", not "something broke".
      - name: Local-only locks and the end-to-end privacy guarantees
        run: |
          python -m pytest tests/test_config.py tests/test_end_to_end.py -q

      - name: CODE_ENFORCED_LOCAL_ONLY still covers father and husband
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from plaud_bridge.config import CODE_ENFORCED_LOCAL_ONLY

          required = {"father", "husband"}
          missing = required - set(CODE_ENFORCED_LOCAL_ONLY)
          if missing:
              raise SystemExit(
                  f"CODE_ENFORCED_LOCAL_ONLY no longer covers {sorted(missing)}. "
                  "If this is deliberate, write the ADR in GOVERNANCE.md and update "
                  "this check in the same commit."
              )
          print("ok:", sorted(CODE_ENFORCED_LOCAL_ONLY))
          PY
